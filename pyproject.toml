[project]
name = "reliquary-worker"
version = "0.1.0"
description = "Reliquary rollout worker — Bittensor-free generation engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.20.0",
    "transformers==5.9.0",
    "safetensors>=0.3.0",
    "pydantic>=2.3,<3.0.0",
    "httpx>=0.25.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.14.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "bitsandbytes>=0.43.0",
]

[project.scripts]
reliquary-worker = "worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
